version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: pizzauser
      POSTGRES_PASSWORD: pizzapassword
      POSTGRES_DB: pizzavault
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://pizzauser:pizzapassword@db:5432/pizzavault?schema=public"
    depends_on:
      - db

volumes:
  pgdata:
